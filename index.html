<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JDM Redline Speedometer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="hud" class="hud" aria-label="Vehicle dashboard">
    <div class="topline">
      <div class="brand"><span class="brand-mark">J</span><span>JDM<span class="red">/</span>REDLINE</span></div>
      <div class="status"><i id="engineDot"></i><span id="engineText">ENGINE OFF</span></div>
    </div>

    <div class="speed-row">
      <div class="speed-block">
        <div class="eyebrow">VEHICLE SPEED</div>
        <div class="speed-value"><span id="speed">000</span><small id="unit">KM/H</small></div>
      </div>
      <div class="gear-block">
        <span class="eyebrow">GEAR</span>
        <strong id="gear">N</strong>
      </div>
    </div>

    <div class="rpm-area">
      <div class="rpm-head"><span>ENGINE RPM</span><span id="rpmText">0.0 × 1000</span></div>
      <div class="rpm-track" role="progressbar" aria-label="Engine RPM" aria-valuemin="0" aria-valuemax="100">
        <div id="rpmFill" class="rpm-fill"></div>
        <div class="redline-zone"></div>
      </div>
      <div class="rpm-ticks"><span>0</span><span>2</span><span>4</span><span>6</span><span class="red">8</span></div>
    </div>

    <div class="bottom-row">
      <div class="metric fuel">
        <div class="metric-icon">F</div>
        <div class="metric-copy"><span class="metric-label">FUEL</span><strong><span id="fuel">76</span><small>%</small></strong></div>
        <div class="mini-track"><i id="fuelFill"></i></div>
      </div>
      <div class="indicator-group">
        <span id="leftIndicator" class="indicator">◀</span>
        <span id="seatbelt" class="seatbelt" title="Seatbelt">BELT</span>
        <span id="rightIndicator" class="indicator">▶</span>
      </div>
    </div>
    <div class="footer-line"><span id="engineState">POWERTRAIN STANDBY</span><span class="live-tag"><b></b> LIVE DATA</span></div>
  </main>

  <aside id="previewPanel" class="preview-panel">
    <div class="preview-title">PREVIEW MODE <span>Browser demo</span></div>
    <div class="preview-controls">
      <label>Speed <input id="speedControl" type="range" min="0" max="320" value="124"><output id="speedOut">124 km/h</output></label>
      <label>RPM <input id="rpmControl" type="range" min="0" max="100" value="64"><output id="rpmOut">64%</output></label>
      <label>Fuel <input id="fuelControl" type="range" min="0" max="100" value="76"><output id="fuelOut">76%</output></label>
      <label>Gear <select id="gearControl"><option value="N">N</option><option value="R">R</option><option value="1">1</option><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select></label>
    </div>
    <div class="preview-buttons">
      <button id="engineButton">Toggle engine</button>
      <button id="beltButton">Toggle seatbelt</button>
      <button id="leftButton">Left signal</button>
      <button id="rightButton">Right signal</button>
      <button id="resetButton">Reset demo</button>
    </div>
    <p>These controls simulate dashboard data in a normal browser. FiveM uses client.lua messages instead.</p>
  </aside>
  <script src="script.js"></script>
</body>
</html>
